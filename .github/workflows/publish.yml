name: Publish Multi-Platform Binary Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (true/false)'
        default: 'false'
        required: false

jobs:
  # ─── Wrapper Package (platform-independent) ────────────
  wrapper:
    name: Build Wrapper Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build wrapper
        run: bun run ./scripts/build-publish-bin.ts --only-wrapper

      - name: Upload wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-package
          path: dist/publish/
          retention-days: 1

  # ─── Platform Binary Packages (matrix) ─────────────────
  platform-binary:
    name: Build ${{ matrix.platform.label }} Binary
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: darwin-arm64,   runner: macos-14,       key: darwin-arm64 }
          - { label: linux-x64,      runner: ubuntu-22.04,   key: linux-x64 }
          - { label: linux-arm64,    runner: ubuntu-24.04-arm, key: linux-arm64 }
          - { label: linux-x64-musl, runner: ubuntu-22.04,   key: linux-x64-musl, musl: true }
          - { label: linux-arm64-musl, runner: ubuntu-24.04-arm, key: linux-arm64-musl, musl: true }
          - { label: win32-x64,      runner: windows-latest, key: win32-x64 }
          - { label: win32-arm64,    runner: windows-11-arm, key: win32-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # musl Linux: build in Docker for musl libc
      - name: Build musl Linux binary (Docker)
        if: matrix.platform.musl
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace \
            -w /workspace oven/bun:1-alpine sh -c \
            "bun install && bun run ./scripts/build-publish-bin.ts --only-bin"

      # Native build for other platforms
      - name: Build platform binary
        if: "!matrix.platform.musl"
        run: bun run ./scripts/build-publish-bin.ts --only-bin

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.key }}
          path: dist/publish-bin/${{ matrix.platform.key }}/
          retention-days: 1

  # ─── Publish to npm ────────────────────────────────────
  publish:
    name: Publish to npm
    needs: [wrapper, platform-binary]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts/

      - name: Reconstruct package structure
        run: |
          # Wrapper
          cp -r dist/artifacts/wrapper-package/* dist/publish/

          # Binary packages
          for dir in dist/artifacts/binary-*/; do
            platform=$(basename "$dir" | sed 's/binary-//')
            mkdir -p dist/publish-bin/$platform
            cp -r "$dir"/* dist/publish-bin/$platform/
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish wrapper package
        run: |
          cd dist/publish
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish platform binary packages
        run: |
          for dir in dist/publish-bin/*/; do
            cd "$dir"
            echo "Publishing $(pwd)..."
            npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
