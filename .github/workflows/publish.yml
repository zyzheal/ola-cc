name: Publish Multi-Platform Binary Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'feature-openai-bin'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (true/false)'
        default: 'false'
        required: false

jobs:
  # ─── Wrapper Package (platform-independent) ────────────
  wrapper:
    name: Build Wrapper Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build JS bundle (for Windows + wrapper)
        run: bun run ./scripts/build-publish.ts --publish

      - name: Build wrapper
        run: bun run ./scripts/build-publish-bin.ts --only-wrapper

      - name: Test wrapper package.json
        run: |
          node -e "const pkg = require('./dist/publish/package.json'); console.log('Wrapper pkg:', pkg.name, pkg.version)"

      - name: Test CLI bundle
        run: |
          node dist/publish/cli.mjs --version

      - name: Upload wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-package
          path: dist/publish/
          retention-days: 1

  # ─── Platform Binary Packages (matrix) ─────────────────
  platform-binary:
    name: Build ${{ matrix.platform.label }} Binary
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: darwin-arm64,   runner: macos-14,       key: darwin-arm64 }
          - { label: darwin-x64,     runner: macos-14,       key: darwin-x64, jsbundle: true }
          - { label: linux-x64,      runner: ubuntu-22.04,   key: linux-x64 }
          - { label: linux-arm64,    runner: ubuntu-24.04-arm, key: linux-arm64 }
          # musl platforms: requires actual musl system to build, skip for now
          # - { label: linux-x64-musl, runner: ubuntu-22.04,   key: linux-x64-musl, musl: true }
          # - { label: linux-arm64-musl, runner: ubuntu-24.04-arm, key: linux-arm64-musl, musl: true }
          - { label: win32-x64,      runner: windows-latest, key: win32-x64 }
          - { label: win32-arm64,    runner: windows-11-arm, key: win32-arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Build JS bundle (cli.mjs) — needed for Windows fallback and integration test
      - name: Build JS bundle
        run: bun run ./scripts/build-publish.ts --publish

      # musl Linux: build in Docker for musl libc
      # Note: This is a best-effort build. For production, build on actual musl distro.
      - name: Build musl Linux binary (Docker)
        if: matrix.platform.musl
        run: |
          # Copy node_modules to Docker for local file: dependencies
          docker run --rm -v ${{ github.workspace }}:/workspace \
            -w /workspace oven/bun:1-alpine sh -c \
            "cp -r node_modules node_modules.cache 2>/dev/null || true; \
             bun install ---cache node_modules.cache; \
             bun run ./scripts/build-publish-bin.ts --only-bin || echo 'musl build skipped'"

      # JS bundle platforms: darwin-x64 (no cross-compile) and win32 (pkg unreliable)
      - name: Build JS bundle package
        if: matrix.platform.jsbundle
        env:
          BUILD_PUBLISH_BIN_PLATFORM: ${{ matrix.platform.key == 'darwin-x64' && 'darwin' || '' }}
          BUILD_PUBLISH_BIN_ARCH: ${{ matrix.platform.key == 'darwin-x64' && 'x64' || '' }}
        run: bun run ./scripts/build-publish-bin.ts --only-bin

      # Native build for macOS arm64 and Linux
      - name: Build platform binary
        if: "!matrix.platform.musl && !matrix.platform.jsbundle"
        run: bun run ./scripts/build-publish-bin.ts --only-bin

      # Build wrapper package.json for integration test
      - name: Build wrapper for integration test
        run: bun run ./scripts/build-publish-bin.ts --only-wrapper

      # ─── Test phase ──────────────────────────────────────
      # Windows: test native .exe binary
      - name: Test Windows binary
        if: startsWith(matrix.platform.key, 'win32')
        run: |
          ./dist/publish-bin/${{ matrix.platform.key }}/ola-cc --version
        shell: bash

      # macOS arm64/Linux: test native binary
      - name: Test native binary
        if: "!matrix.platform.musl && !matrix.platform.jsbundle && !startsWith(matrix.platform.key, 'win32')"
        run: |
          ./dist/publish-bin/${{ matrix.platform.key }}/ola-cc --version
        shell: bash

      # Verify ugrep binary is included in wrapper package (Windows x64 only)
      - name: Verify ugrep in package
        if: matrix.platform.key == 'win32-x64'
        run: |
          echo "Checking ugrep binary in wrapper package..."
          if [[ -f "vendor/ugrep/x64-win32/ugrep.exe" ]]; then
            echo "ugrep binary found in vendor directory"
          else
            echo "ERROR: ugrep binary not found!"
            exit 1
          fi
        shell: bash

      # Integration test: darwin-x64 JS bundle (cross-platform on arm64 runner)
      # Note: Cannot fully simulate darwin-x64 npm install on arm64 runner,
      # since install.cjs detects the runner's actual platform (darwin-arm64).
      # Just verify the JS bundle is valid.
      - name: Test darwin-x64 JS bundle
        if: matrix.platform.key == 'darwin-x64'
        run: |
          set -e
          BIN_DIR="dist/publish-bin/${{ matrix.platform.key }}"
          echo "=== darwin-x64 binary package contents ==="
          ls -la "$BIN_DIR/"
          echo "=== Testing JS bundle ==="
          node "$BIN_DIR/cli.mjs" --version

      # Integration test: simulate real npm install from packed tarballs (all other platforms)
      - name: Test wrapper + binary integration
        if: matrix.platform.key != 'darwin-x64'
        run: |
          set -e

          # Pack wrapper package
          cd dist/publish
          npm pack --quiet 2>/dev/null
          WRAPPER_TGZ="$(find . -name '*.tgz' -maxdepth 1 | head -1)"
          echo "Wrapper tarball: $WRAPPER_TGZ"

          # Show wrapper tarball contents
          echo "=== Wrapper tarball contents ==="
          tar -tzf "$WRAPPER_TGZ"

          echo "=== Wrapper package.json ==="
          tar -xzf "$WRAPPER_TGZ" -O package/package.json

          echo "=== Wrapper install.cjs ==="
          tar -xzf "$WRAPPER_TGZ" -O package/install.cjs | head -5

          # Pack binary package
          BIN_DIR="dist/publish-bin/${{ matrix.platform.key }}"
          cd "$GITHUB_WORKSPACE/$BIN_DIR"
          npm pack --quiet 2>/dev/null
          BIN_TGZ="$(find . -name '*.tgz' -maxdepth 1 | head -1)"
          echo "Binary tarball: $BIN_TGZ"

          echo "=== Binary tarball contents ==="
          tar -tzf "$BIN_TGZ"

          # Create a clean test directory and copy tarballs there
          TEST_DIR="$RUNNER_TEMP/ola-cc-test"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          # Copy tarballs using find + cp to avoid path issues on Windows
          cp "$GITHUB_WORKSPACE/dist/publish/$WRAPPER_TGZ" ./wrapper.tgz
          cp "$GITHUB_WORKSPACE/$BIN_DIR/$BIN_TGZ" ./binary.tgz

          # Initialize minimal package.json
          echo '{"name":"test","private":true}' > package.json

          # Install from tarballs
          echo "=== Running npm install ==="
          AUTHORIZED=1 npm install --foreground-scripts --no-save ./wrapper.tgz ./binary.tgz 2>&1

          # Verify the binary was placed by postinstall
          # All platforms: use bin/ola-cc.js which delegates to native binary or JS bundle
          ./node_modules/@zyzheal/ola-cc/bin/ola-cc --version

          # Cleanup
          rm -rf "$TEST_DIR"
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.key }}
          path: dist/publish-bin/${{ matrix.platform.key }}/
          retention-days: 1

  # ─── Publish to npm ────────────────────────────────────
  publish:
    name: Publish to npm
    needs: [wrapper, platform-binary]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts/

      - name: Reconstruct package structure
        run: |
          # Wrapper
          mkdir -p dist/publish
          cp -r dist/artifacts/wrapper-package/* dist/publish/

          # Binary packages
          for dir in dist/artifacts/binary-*/; do
            platform=$(basename "$dir" | sed 's/binary-//')
            mkdir -p dist/publish-bin/$platform
            cp -r "$dir"/* dist/publish-bin/$platform/
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish wrapper package
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"
          cd dist/publish
          AUTHORIZED=1 npm publish --access public

      - name: Publish platform binary packages
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"
          for dir in dist/publish-bin/*/; do
            cd "$dir"
            echo "Publishing $(pwd)..."
            AUTHORIZED=1 npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done
