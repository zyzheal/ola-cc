name: Publish Multi-Platform Binary Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'feature-openai-bin'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (true/false)'
        default: 'false'
        required: false

jobs:
  # ─── Wrapper Package (platform-independent) ────────────
  wrapper:
    name: Build Wrapper Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build JS bundle (for Windows + wrapper)
        run: bun run ./scripts/build-publish.ts --publish

      - name: Build wrapper
        run: bun run ./scripts/build-publish-bin.ts --only-wrapper

      - name: Test wrapper package.json
        run: |
          node -e "const pkg = require('./dist/publish/package.json'); console.log('Wrapper pkg:', pkg.name, pkg.version); if (pkg.version !== '0.3.5') process.exit(1)"

      - name: Test CLI bundle
        run: |
          node dist/publish/cli.mjs --version | grep -q "0.3.5" && echo "CLI version OK"

      - name: Upload wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-package
          path: dist/publish/
          retention-days: 1

  # ─── Platform Binary Packages (matrix) ─────────────────
  platform-binary:
    name: Build ${{ matrix.platform.label }} Binary
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: darwin-arm64,   runner: macos-14,       key: darwin-arm64 }
          - { label: linux-x64,      runner: ubuntu-22.04,   key: linux-x64 }
          - { label: linux-arm64,    runner: ubuntu-24.04-arm, key: linux-arm64 }
          - { label: linux-x64-musl, runner: ubuntu-22.04,   key: linux-x64-musl, musl: true }
          - { label: linux-arm64-musl, runner: ubuntu-24.04-arm, key: linux-arm64-musl, musl: true }
          - { label: win32-x64,      runner: windows-latest, key: win32-x64 }
          - { label: win32-arm64,    runner: windows-11-arm, key: win32-arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # musl Linux: build in Docker for musl libc
      - name: Build musl Linux binary (Docker)
        if: matrix.platform.musl
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace \
            -w /workspace oven/bun:1-alpine sh -c \
            "bun install && bun run ./scripts/build-publish-bin.ts --only-bin"

      # Native build for macOS/Linux, pkg build for Windows
      - name: Build platform binary
        if: "!matrix.platform.musl"
        run: bun run ./scripts/build-publish-bin.ts --only-bin

      # Windows: install pkg at fixed version before building
      - name: Install pkg (Windows)
        if: startsWith(matrix.platform.key, 'win32')
        run: npm install @yao-pkg/pkg@6.18.1 --save-dev --no-save
        shell: bash

      # ─── Test phase ──────────────────────────────────────
      # Windows: test compiled .exe (or JS bundle fallback)
      - name: Test Windows binary
        if: startsWith(matrix.platform.key, 'win32')
        run: |
          if [[ -f "dist/publish-bin/${{ matrix.platform.key }}/ola-cc.exe" ]]; then
            echo "Found compiled .exe"
            ./dist/publish-bin/${{ matrix.platform.key }}/ola-cc.exe --version
          else
            echo "Using JS bundle fallback"
            node dist/publish-bin/${{ matrix.platform.key }}/cli.mjs --version
          fi
        shell: bash

      # macOS/Linux: test native binary
      - name: Test native binary
        if: "!startsWith(matrix.platform.key, 'win32')"
        run: |
          ./dist/publish-bin/${{ matrix.platform.key }}/ola-cc --version
        shell: bash

      # Integration test: wrapper + binary in a clean npm workspace
      - name: Test wrapper + binary integration
        run: |
          # Build wrapper (uses current platform's cli.mjs from build-publish step)
          bun run ./scripts/build-publish-bin.ts --only-wrapper

          # Create a clean test directory to avoid root project dependencies
          TEST_DIR="$RUNNER_TEMP/ola-cc-test"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          # Initialize minimal package.json (no deps to resolve)
          echo '{"name":"test","private":true}' > package.json

          # Install only the wrapper + binary packages (no transitive deps)
          AUTHORIZED=1 npm install --no-save \
            --ignore-scripts \
            "${{ github.workspace }}/dist/publish/" \
            "${{ github.workspace }}/dist/publish-bin/${{ matrix.platform.key }}/" 2>&1

          if [[ "${{ matrix.platform.key }}" == win32-* ]]; then
            # Windows: postinstall copies ola-cc.exe to bin/ (or uses JS bundle fallback)
            node node_modules/@zyzheal/ola-cc/install.cjs 2>&1
            npx ola-cc --version
          else
            # macOS/Linux: run postinstall to place native binary
            node node_modules/@zyzheal/ola-cc/install.cjs 2>&1
            npx ola-cc --version
          fi

          # Cleanup
          rm -rf "$TEST_DIR"
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.key }}
          path: dist/publish-bin/${{ matrix.platform.key }}/
          retention-days: 1

  # ─── Publish to npm ────────────────────────────────────
  publish:
    name: Publish to npm
    needs: [wrapper, platform-binary]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts/

      - name: Reconstruct package structure
        run: |
          # Wrapper
          cp -r dist/artifacts/wrapper-package/* dist/publish/

          # Binary packages
          for dir in dist/artifacts/binary-*/; do
            platform=$(basename "$dir" | sed 's/binary-//')
            mkdir -p dist/publish-bin/$platform
            cp -r "$dir"/* dist/publish-bin/$platform/
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish wrapper package
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          cd dist/publish
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          AUTHORIZED=1 npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB }}

      - name: Publish platform binary packages
        run: |
          for dir in dist/publish-bin/*/; do
            cd "$dir"
            echo "Publishing $(pwd)..."
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
            AUTHORIZED=1 npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB }}
